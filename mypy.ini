# Config do mypy. As dependências continuam em requirements.txt.
[mypy]
python_version = 3.12
# Os entry points importam `modules.*`; o mypy segue os imports a partir
# daqui, então listar `modules` separado criaria nomes de módulo duplicados.
files = app.py, compare_algorithms.py
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
check_untyped_defs = True
