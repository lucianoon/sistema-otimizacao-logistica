[project]
name = "sistema-otimizacao-logistica"
version = "0.1.0"
description = "Otimização de rotas de veículos (CVRP) com OR-Tools e interface Streamlit, adaptada à logística do Brasil"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.54,<2",
    "pandas>=2.1.4,<3",
    "numpy>=1.26.3,<3",
    "ortools>=9.8,<10",
    "folium>=0.15.1,<1",
    "streamlit-folium>=0.18,<1",
    "plotly>=5.18,<8",
    "openpyxl>=3.1.2,<4",
    "geopy>=2.4.1,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
# App Streamlit, não um pacote instalável: o uv só gerencia o ambiente.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["modules", "."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.mypy]
python_version = "3.12"
# Os entry points importam `modules.*`; o mypy segue os imports a partir
# daqui, então listar `modules` separado criaria nomes de módulo duplicados.
files = ["app.py", "compare_algorithms.py"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
