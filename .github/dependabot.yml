version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # ortools muda a API do solver entre majors, e o optimizer depende dela
      # diretamente (RoutingModel, estratégias de primeira solução).
      - dependency-name: "ortools"
        update-types: ["version-update:semver-major"]
      # numpy NÃO entra aqui de propósito. Prender em 1.x parece conservador,
      # mas trava o conjunto: ortools 9.15 exige numpy>=2.0.2, então o grupo
      # inteiro fica insolúvel (ResolutionImpossible na CI). O código só usa
      # np.zeros/sin/cos/pi/random, estáveis no 2.x, e nenhuma API removida.
      # pandas 2→3 e streamlit majors mudam API pública.
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]
      - dependency-name: "streamlit"
        update-types: ["version-update:semver-major"]
    # Todas as versões estão fixas com ==, então o conjunto anda junto e a CI
    # valida o lote inteiro. Um PR agrupado é o formato certo aqui.
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
