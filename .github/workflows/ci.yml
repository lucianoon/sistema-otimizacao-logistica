name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        # --locked falha se o uv.lock estiver fora de sincronia com o pyproject:
        # o CI testa exatamente o que a imagem Docker instala.
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Run tests
        run: uv run pytest -q

      # requirements.txt é derivado do lock para o Streamlit Cloud, que não lê
      # uv.lock. Se alguém editar um sem o outro, este passo pega.
      - name: requirements.txt em sincronia com uv.lock
        run: |
          uv export --no-dev --no-hashes --no-annotate --no-header -o /tmp/requirements.txt
          diff -u requirements.txt /tmp/requirements.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag sistema-otimizacao-logistica:ci .

      # Construir não basta: o smoke sobe o container, confirma que o Streamlit
      # atende e que o processo não é root.
      - name: Smoke test image
        run: |
          docker run --detach --name otimizador -p 8501:8501 sistema-otimizacao-logistica:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8501/_stcore/health; then
              echo; echo "Streamlit respondeu na tentativa $i"
              docker exec otimizador id -u | grep -qv '^0$' || { echo "container roda como root"; exit 1; }
              exit 0
            fi
            sleep 1
          done
          docker logs otimizador
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f otimizador || true
